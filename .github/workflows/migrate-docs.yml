name: Migrate RelicPrison Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-docs.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public docs repository
        uses: actions/checkout@v7
        with:
          path: docs-repo

      - name: Check out RelicPrison source for one-time migration
        uses: actions/checkout@v7
        with:
          repository: Sfg246/RelicPrison
          ref: main
          path: source-repo

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate current source-driven references
        working-directory: source-repo/wiki
        run: |
          npm install --no-audit --no-fund
          npm run docs:generate

      - name: Separate public documentation from plugin source
        run: python3 docs-repo/.github/scripts/migrate_docs.py source-repo docs-repo

      - name: Verify standalone documentation build
        working-directory: docs-repo/wiki
        env:
          DOCS_BASE: /RelicPRisonDocs/
        run: |
          npm install --no-audit --no-fund
          npm run docs:build

      - name: Commit migrated documentation
        working-directory: docs-repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: separate public website from private plugin source'
          git push
